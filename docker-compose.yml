services:
  neo4j:
    image: neo4j:5.26-community
    container_name: kgnotes-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser / HTTP
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/kgnotes-pass
      NEO4J_server_memory_pagecache_size: 512M
      NEO4J_server_memory_heap_initial__size: 512M
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p kgnotes-pass 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

volumes:
  neo4j_data:
  neo4j_logs:
